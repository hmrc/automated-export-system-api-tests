environment = local

local {
  services {
    host = "http://localhost"

    authStub {
      port = 8585
      productionRoute = "/government-gateway/session/login"
    }

    aes {
      port = 5000
      productionRoute = "/automated-export-system"
      notificationToken = "some-token"
    }
  }
}

dev {
  services {
    host = "https://www.development.tax.service.gov.uk"

    authStub {
      productionRoute = "/government-gateway/session/login"
    }

    aes {
      productionRoute = "/automated-export-system"
    }
  }
}

qa {
  services {
    host = "https://www.qa.tax.service.gov.uk"

    authStub {
      productionRoute = "/government-gateway/session/login"
    }

    aes {
      productionRoute = "/automated-export-system"
    }
  }
}

staging {
  services {
    host = "https://www.staging.tax.service.gov.uk"

    authStub {
      productionRoute = "/government-gateway/session/login"
    }

    aes {
      productionRoute = "/automated-export-system"
    }
  }
}